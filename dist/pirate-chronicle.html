<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pirate Chronicle</title>
  <style>
/* Placeholder look. The UI chat designs the real one. */
:root {
  --paper: #f3ead7;
  --paper-dark: #e6d8b8;
  --ink: #2b2118;
  --muted: #7a6a55;
  --rule: #c9b48a;
  --accent: #7b2d1e;
  --good: #3f6b35;
  --mid: #8a6a1f;
  --bad: #8f2f22;
  --serif: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #d9cba8; color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.5; }
button {
  font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule);
  border-radius: 4px; padding: 0.45em 0.9em; cursor: pointer; text-align: left;
}
button:hover:not(:disabled) { background: #fff8e8; border-color: var(--accent); }
button:disabled { cursor: not-allowed; opacity: 0.55; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { background: #943726; color: #fff; }
h1, h2, h3 { font-weight: normal; margin: 0 0 0.4em; }
p { margin: 0 0 0.8em; }
.muted { color: var(--muted); }
.small { font-size: 0.85em; }

/* Title */
.title-screen { max-width: 520px; margin: 12vh auto; padding: 2em; background: var(--paper); border: 1px solid var(--rule); text-align: center; }
.title-screen h1 { font-size: 2.4em; letter-spacing: 0.04em; }
.title-screen .sub { color: var(--muted); font-style: italic; }
.title-buttons { display: flex; flex-direction: column; gap: 0.6em; margin: 1.5em auto; max-width: 260px; }
.title-buttons button { text-align: center; }
.note { font-size: 0.85em; color: var(--muted); }

/* Frame */
.game { max-width: 1180px; margin: 0 auto; min-height: 100vh; background: var(--paper); box-shadow: 0 0 30px rgba(0,0,0,0.15); }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6em 1em; padding: 0.6em 1em; border-bottom: 1px solid var(--rule); background: var(--paper-dark); }
.topbar .brand { font-size: 1.15em; letter-spacing: 0.05em; }
.topbar .when { font-style: italic; }
.topbar .spacer { flex: 1; }
.topbar button { padding: 0.3em 0.7em; font-size: 0.85em; }
.ap i { display: inline-block; width: 0.75em; height: 0.75em; border-radius: 50%; margin-right: 3px; border: 1px solid var(--accent); vertical-align: middle; }
.ap i.on { background: var(--accent); }
.ap small { color: var(--muted); }
.body { display: grid; grid-template-columns: 300px 1fr; }
.sheet { padding: 1.2em; border-right: 1px solid var(--rule); font-size: 0.92em; }
.stage { padding: 1.5em 2em; min-width: 0; }

/* Captain sheet */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4em; margin: 0.8em 0; }
.stat { border: 1px solid var(--rule); text-align: center; padding: 0.3em 0; font-size: 0.8em; }
.stat b { display: block; font-size: 1.5em; font-weight: normal; }
.ledger { width: 100%; border-collapse: collapse; margin-top: 0.8em; }
.ledger th { text-align: left; font-weight: normal; color: var(--muted); padding: 0.15em 0.5em 0.15em 0; white-space: nowrap; vertical-align: top; }
.ledger td { padding: 0.15em 0; }
.ledger tr + tr { border-top: 1px dotted var(--rule); }

/* Scene */
.scene { max-width: 680px; }
.where { font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.setup { font-size: 1.05em; margin: 0.6em 0 1.2em; }
.choices { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.7em; }
.choices li > button { width: 100%; }
.choices .lock, .choices .cost { display: block; font-size: 0.82em; color: var(--muted); margin: 0.2em 0 0 0.3em; }
.check { font-size: 0.82em; margin: 0.25em 0 0 0.3em; color: var(--muted); }
.check summary { cursor: pointer; }
.check ul { list-style: none; padding: 0.4em 0.8em; margin: 0.3em 0; background: var(--paper-dark); max-width: 340px; }
.check li { display: flex; justify-content: space-between; gap: 1em; }
.check li.total { border-top: 1px solid var(--rule); margin-top: 0.2em; padding-top: 0.2em; color: var(--ink); }
.ctype { color: var(--ink); }
.tier { font-weight: bold; }
.tier-Trivial, .tier-VeryEasy, .tier-Easy { color: var(--good); }
.tier-Medium { color: var(--mid); }
.tier-Hard, .tier-VeryHard { color: var(--bad); }

/* Result */
.result { border-top: 1px solid var(--rule); padding-top: 1em; }
.you-chose { font-style: italic; color: var(--muted); }
.badge { display: inline-block; padding: 0.15em 0.6em; margin-bottom: 0.6em; border-radius: 3px; color: #fff; font-size: 0.85em; letter-spacing: 0.05em; }
.badge-clean { background: var(--good); }
.badge-partial { background: var(--mid); }
.badge-setback { background: var(--bad); }
.dice { font-family: monospace; font-size: 0.85em; color: var(--muted); margin-bottom: 0.5em; }
.effects { font-size: 0.88em; color: var(--muted); padding-left: 1.2em; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6em; margin-top: 1em; }

/* Log */
.log { margin-top: 2.5em; font-size: 0.85em; color: var(--muted); max-width: 680px; }
.log summary { cursor: pointer; }
.log ul { padding-left: 1.2em; }

/* Developer panel */
.modal { position: fixed; inset: 0; background: rgba(30, 20, 10, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 1em; overflow: auto; z-index: 10; }
.panel { background: var(--paper); border: 1px solid var(--rule); padding: 1.4em; max-width: 560px; width: 100%; }
.panel label { display: block; margin: 0.4em 0; }
.panel ul { font-size: 0.85em; }

.toast { position: fixed; bottom: 1.2em; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 0.6em 1.2em; border-radius: 4px; z-index: 20; }

/* Phone */
@media (max-width: 760px) {
  html, body { font-size: 16px; }
  .body { grid-template-columns: 1fr; }
  .sheet { border-right: 0; border-bottom: 1px solid var(--rule); order: 2; }
  .stage { padding: 1.2em 1em; order: 1; }
}
</style>
</head>

  <!-- Engine (rules; no screen code) -->
  <script>
/* Pirate Chronicle — seeded randomness.
 *
 * Every roll in the game comes from a "key": a string built from the world
 * seed plus where the roll happens (season, scene, choice, attempt). The same
 * key always gives the same dice, so reloading a save never changes a result
 * (§11.1: "The dice are hidden and seeded per scene").
 */
(function () {
  "use strict";
  var PC = (globalThis.PC = globalThis.PC || {});

  // Turn any string into a 32-bit number (cyrb53-style mixing).
  function hashString(str) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h1 ^ (h2 >>> 1)) >>> 0;
  }

  // Small, fast seeded generator. Returns a function giving 0 <= x < 1.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fromKey(key) {
    return mulberry32(hashString(String(key)));
  }

  function rollDice(key, count, sides) {
    var r = fromKey(key);
    var out = [];
    for (var i = 0; i < count; i++) out.push(1 + Math.floor(r() * sides));
    return out;
  }

  // A fresh world seed for a new game.
  function newWorldSeed() {
    if (globalThis.crypto && globalThis.crypto.getRandomValues) {
      var a = new Uint32Array(1);
      globalThis.crypto.getRandomValues(a);
      return a[0].toString(36);
    }
    return Math.floor(Math.random() * 4294967296).toString(36);
  }

  PC.rng = {
    hashString: hashString,
    fromKey: fromKey,
    rollDice: rollDice,
    roll2d6: function (key) { return rollDice(key, 2, 6); },
    newWorldSeed: newWorldSeed,
  };
})();
</script>
  <script>
/* Pirate Chronicle — the check system (§11).
 *
 *   Roll 2d6 + edge.  5 or less: setback.  6-8: partial.  9+: clean.
 *   Edge = stat + type training + captain modifiers + meter modifiers - DR,
 *   clamped to -4..+6.
 *
 * Nothing in this file touches the screen; ui.js draws what these return.
 */
(function () {
  "use strict";
  var PC = (globalThis.PC = globalThis.PC || {});

  var RULES = {
    EDGE_MIN: -4,
    EDGE_MAX: 6,
    CAPTAIN_MOD_CAP: 3, // net traits/flaws/tags/items, ±3 (§11.2)
    METER_MOD_CAP: 3,   // Dread and Standing slot, capped at +3 (§11.2)
    PARTIAL_AT: 6,
    CLEAN_AT: 9,
    // OPEN (§11.2, pinned in §13.2): does the locked-option UI trigger at an
    // unclamped edge of exactly -4, or only below it? This setting locks at
    // -4 or lower. Change to -5 to lock only below the floor.
    LOCK_AT_OR_BELOW: -4,
    DR_MAX: 8, // data accepts 0-8; Year 1 content uses 0-5
  };

  var STATS = ["Cunning", "Daring", "Command", "Seamanship", "Charm", "Grit"];

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

  function readTotal(total) {
    if (total >= RULES.CLEAN_AT) return "clean";
    if (total >= RULES.PARTIAL_AT) return "partial";
    return "setback";
  }

  // Exact odds for an edge, counted over all 36 dice pairs.
  function odds(edge) {
    var partialOrBetter = 0, clean = 0;
    for (var a = 1; a <= 6; a++) for (var b = 1; b <= 6; b++) {
      var r = readTotal(a + b + edge);
      if (r !== "setback") partialOrBetter++;
      if (r === "clean") clean++;
    }
    return { partialOrBetter: partialOrBetter / 36, clean: clean / 36 };
  }

  // The tier shown to the player, from their actual edge (§11.3).
  function tier(edge) {
    if (edge >= 5) return "Trivial";
    if (edge >= 3) return "Very Easy";
    if (edge >= 1) return "Easy";
    if (edge >= -1) return "Medium";
    if (edge === -2) return "Hard";
    return "Very Hard";
  }

  // DR labels for authors (§11.3).
  var DR_LABELS = ["Routine", "Simple", "Moderate", "Standard", "Demanding", "Brutal", "Heroic", "Legendary", "Mythic"];

  function checkTypeInfo(type) {
    var t = PC.data.checkTypes[type];
    if (!t) throw new Error("Unknown check type: " + type);
    return t;
  }

  // Which stats a check uses: the type's home stat, or a scene override,
  // plus an optional second stat (§11.2).
  function statsUsed(check) {
    var first = check.stat || checkTypeInfo(check.type).stat;
    return check.stat2 ? [first, check.stat2] : [first];
  }

  // Two stats average, rounded up (Cunning 3 with Charm 1 gives 2).
  function statValue(captain, stats) {
    var sum = 0;
    stats.forEach(function (s) { sum += captain.stats[s] || 0; });
    return Math.ceil(sum / stats.length);
  }

  // Every modifier source the captain carries. Each id points at an entry
  // in PC.data.modifiers. Unknown ids are skipped (content may lag code).
  function captainSources(captain) {
    var out = [];
    ["traits", "flaws", "tags", "items"].forEach(function (kind) {
      (captain[kind] || []).forEach(function (id) {
        var m = PC.data.modifiers[id];
        if (m) out.push({ id: id, kind: kind, mod: m });
      });
    });
    return out;
  }

  function whenMatches(when, ctx) {
    if (!when) return true;
    if (when.condition && (ctx.conditions || []).indexOf(when.condition) < 0) return false;
    return true;
  }

  // Captain modifiers for one check. A modifier that names a type follows
  // the type; one that names a stat follows the stats actually used (§11.2).
  // A modifier with the same name never applies twice.
  function captainModifiers(captain, check, stats, ctx) {
    var seen = {}, parts = [], capped = 0, outside = 0;
    captainSources(captain).forEach(function (src) {
      (src.mod.edge || []).forEach(function (e) {
        var hit = (e.type && e.type === check.type) ||
                  (e.stat && stats.indexOf(e.stat) >= 0);
        if (!hit || !whenMatches(e.when, ctx)) return;
        var name = src.mod.name || src.id;
        if (seen[name]) return;
        seen[name] = true;
        parts.push({ label: name, value: e.value, outsideCap: !!e.outsideCap });
        if (e.outsideCap) outside += e.value; else capped += e.value;
      });
    });
    var cappedTotal = clamp(capped, -RULES.CAPTAIN_MOD_CAP, RULES.CAPTAIN_MOD_CAP);
    return { parts: parts, total: cappedTotal + outside, wasCapped: cappedTotal !== capped };
  }

  // Meter modifiers (Dread and Standing, §11.8.5). Not built in Milestone 0:
  // a scene can pass a fixed value as check.meter while the real rule waits.
  function meterModifier(state, check) {
    var v = check.meter || 0;
    return clamp(v, -99, RULES.METER_MOD_CAP);
  }

  // Full breakdown of a check for one captain. Pure: no dice rolled.
  function assess(state, check, ctx) {
    ctx = ctx || {};
    var cap = state.captain;
    var stats = statsUsed(check);
    var dr = check.dr || 0;
    if (dr < 0 || dr > RULES.DR_MAX) throw new Error("DR out of range: " + dr);
    var parts = [];
    var sv = statValue(cap, stats);
    parts.push({ label: stats.join(" + ") + (stats.length > 1 ? " (average)" : ""), value: sv });
    var tr = (cap.training && cap.training[check.type]) || 0;
    if (tr) parts.push({ label: check.type + " training", value: tr });
    var mods = captainModifiers(cap, check, stats, ctx);
    mods.parts.forEach(function (p) { parts.push(p); });
    var meter = meterModifier(state, check);
    if (meter) parts.push({ label: "Reputation", value: meter });
    parts.push({ label: "Difficulty (" + DR_LABELS[dr] + ")", value: -dr });
    var raw = sv + tr + mods.total + meter - dr;
    var edge = clamp(raw, RULES.EDGE_MIN, RULES.EDGE_MAX);
    var o = odds(edge);
    return {
      type: check.type,
      stats: stats,
      dr: dr,
      parts: parts,
      modsCapped: mods.wasCapped,
      rawEdge: raw,
      edge: edge,
      tier: tier(edge),
      odds: o,
      locked: raw <= RULES.LOCK_AT_OR_BELOW,
    };
  }

  // Roll a check with a seeded key.
  function resolve(state, check, key, ctx) {
    var a = assess(state, check, ctx);
    var dice = PC.rng.roll2d6(key);
    var total = dice[0] + dice[1] + a.edge;
    return { assessment: a, dice: dice, total: total, outcome: readTotal(total), key: key };
  }

  // Which reroll (if any) the captain can use on this check right now.
  // Once per season per source; a few sources grant two (§11.2, §5.7).
  function availableReroll(state, check, outcome) {
    if (outcome === "clean") return null;
    var used = state.rerollsUsed || {};
    var found = null;
    captainSources(state.captain).forEach(function (src) {
      if (found) return;
      var r = src.mod.reroll;
      if (!r) return;
      if (r.types && r.types.indexOf(check.type) < 0) return;
      if (r.on && r.on.indexOf(outcome) < 0) return;
      var per = r.perSeason || 1;
      if ((used[src.id] || 0) >= per) return;
      found = { id: src.id, name: src.mod.name || src.id };
    });
    return found;
  }

  PC.checks = {
    RULES: RULES,
    STATS: STATS,
    DR_LABELS: DR_LABELS,
    readTotal: readTotal,
    odds: odds,
    tier: tier,
    statsUsed: statsUsed,
    assess: assess,
    resolve: resolve,
    availableReroll: availableReroll,
  };
})();
</script>
  <script>
/* Pirate Chronicle — game state, saving and loading.
 *
 * The whole game lives in one plain object ("the world is the save file").
 * It is saved to the browser after every action, and can be exported to a
 * .json file and imported back.
 */
(function () {
  "use strict";
  var PC = (globalThis.PC = globalThis.PC || {});

  var SAVE_VERSION = 1;
  var STORAGE_KEY = "pirate-chronicle-save";
  var SEASONS = ["Spring", "Summer", "Hurricane", "Winter"];
  var AP_PER_SEASON = 7; // §4; under review in playtesting

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // A new game from a captain template (Milestone 0 uses a fixed test
  // captain; the character creator replaces this in a later milestone).
  function newGame(captainTemplate, opts) {
    opts = opts || {};
    var c = clone(captainTemplate);
    return {
      saveVersion: SAVE_VERSION,
      world: { seed: opts.seed || PC.rng.newWorldSeed(), createdAt: new Date().toISOString() },
      time: { year: 1754, season: 0 }, // index into SEASONS
      ap: { max: AP_PER_SEASON, left: AP_PER_SEASON },
      captain: c.captain,
      money: c.money,           // { crew, purse } — §27
      provisions: c.provisions, // lots — §20.6
      ship: c.ship,
      crew: c.crew,
      meters: c.meters,         // Dread, Standing, Heat — §28
      npcs: {},                 // per-NPC deltas only (ladder rung, flags)
      flags: {},
      seen: {},                 // scenes finished (for "Once" scenes)
      rolls: {},                // how many times each roll point has fired
      rerollsUsed: {},          // per source, reset each season
      log: [],
      current: { screen: "scene", sceneId: opts.startScene || PC.data.start.scene, phase: "choosing" },
      settings: { showDice: false },
    };
  }

  function seasonName(state) { return SEASONS[state.time.season]; }

  function advanceSeason(state) {
    state.time.season += 1;
    if (state.time.season >= SEASONS.length) { state.time.season = 0; state.time.year += 1; }
    state.ap.left = state.ap.max;
    state.rerollsUsed = {};
    addLog(state, "— " + seasonName(state) + " " + state.time.year + " begins. —");
  }

  function addLog(state, line) {
    state.log.push(line);
    if (state.log.length > 200) state.log.splice(0, state.log.length - 200);
  }

  // ---- Saving ----------------------------------------------------------

  function serialize(state) { return JSON.stringify(state); }

  // Upgrade an old save to the current shape. Add a step here whenever the
  // save shape changes, so old saves keep loading.
  function migrate(data) {
    if (!data || typeof data !== "object") throw new Error("Not a save file.");
    if (typeof data.saveVersion !== "number") throw new Error("Not a Pirate Chronicle save file.");
    if (data.saveVersion > SAVE_VERSION) throw new Error("This save is from a newer version of the game.");
    // (no migrations yet: version 1 is the first)
    return data;
  }

  function deserialize(text) { return migrate(JSON.parse(text)); }

  // Browser storage can be missing or blocked; never let that crash the game.
  function saveToBrowser(state) {
    try { globalThis.localStorage.setItem(STORAGE_KEY, serialize(state)); return true; }
    catch (e) { return false; }
  }

  function loadFromBrowser() {
    try {
      var t = globalThis.localStorage.getItem(STORAGE_KEY);
      return t ? deserialize(t) : null;
    } catch (e) { return null; }
  }

  function clearBrowserSave() {
    try { globalThis.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  }

  PC.state = {
    SAVE_VERSION: SAVE_VERSION,
    SEASONS: SEASONS,
    newGame: newGame,
    seasonName: seasonName,
    advanceSeason: advanceSeason,
    addLog: addLog,
    serialize: serialize,
    deserialize: deserialize,
    saveToBrowser: saveToBrowser,
    loadFromBrowser: loadFromBrowser,
    clearBrowserSave: clearBrowserSave,
  };
})();
</script>
  <script>
/* Pirate Chronicle — text tokens and pronouns (§33.3.12).
 *
 * Authors write the male form and the engine swaps it for a woman.
 *   {captain.first} {captain.last} {captain.full}
 *   {captain.he} {captain.him} {captain.his} {captain.hers} {captain.himself}
 *   {captain.he's} {captain.he'll} {captain.he'd}
 *   {captain.man} {captain.sir} {captain.lad}
 * Capitalise the form to capitalise the word: {captain.He} -> "He" / "She".
 * The same forms work for any NPC by id: {davey_dell.he}.
 * Bracket tokens: [Ship Name], [Home City].
 */
(function () {
  "use strict";
  var PC = (globalThis.PC = globalThis.PC || {});

  var FORMS = {
    he: ["he", "she"],
    him: ["him", "her"],
    his: ["his", "her"],
    hers: ["his", "hers"],
    himself: ["himself", "herself"],
    "he's": ["he's", "she's"],
    "he'll": ["he'll", "she'll"],
    "he'd": ["he'd", "she'd"],
    man: ["man", "woman"],
    sir: ["sir", "madam"],
    lad: ["lad", "lass"],
  };

  function capFirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function person(state, who) {
    if (who === "captain") {
      var c = state.captain;
      return { first: c.first, last: c.last, gender: c.gender };
    }
    var n = PC.data.npcs && PC.data.npcs[who];
    if (n) return { first: n.first, last: n.last || "", gender: n.gender || "m" };
    return null;
  }

  function resolveToken(state, who, form) {
    var p = person(state, who);
    if (!p) return null;
    var lower = form.toLowerCase();
    var caps = form !== lower;
    var out;
    if (lower === "first") out = p.first;
    else if (lower === "last") out = p.last;
    else if (lower === "full") out = (p.first + " " + p.last).trim();
    else if (FORMS[lower]) out = FORMS[lower][p.gender === "f" ? 1 : 0];
    else return null;
    return caps ? capFirst(out) : out;
  }

  function render(template, state) {
    if (!template) return "";
    var s = String(template);
    s = s.replace(/\{([a-z0-9_]+)\.([A-Za-z']+)\}/g, function (whole, who, form) {
      var r = resolveToken(state, who, form);
      return r === null ? whole : r;
    });
    s = s.replace(/\[Ship Name\]/g, state.ship.name);
    s = s.replace(/\[Home City\]/g, state.captain.homeCity || "your home");
    return s;
  }

  // Tokens left unresolved after rendering (used by the content validator).
  function unresolved(text) {
    var m = String(text).match(/\{[^}]*\}|\[[A-Z][^\]]*\]/g);
    return m || [];
  }

  PC.text = { render: render, unresolved: unresolved, FORMS: FORMS };
})();

  <script>
/* Pirate Chronicle — the scene runner.
 *
 * Scenes are data (content/*.js), written to the §33 template:
 *   setup text, 2-4 choices, each with an optional check and outcomes
 *   (clean / partial / setback, or a single result), effects, and an exit.
 * This file reads that data, rolls checks, applies effects and moves on.
 * It never touches the screen; ui.js asks it what to show.
 */
(function () {
  "use strict";
  var PC = (globalThis.PC = globalThis.PC || {});

  function sceneById(id) {
    var s = PC.data.scenes[id];
    if (!s) throw new Error("Unknown scene: " + id);
    return s;
  }

  // ---- Conditions ------------------------------------------------------
  // Used by "fires when", choice gates (locked / hidden) and variant lines.
  //   { flag: "x" }            flag is true
  //   { notFlag: "x" }         flag is not true
  //   { tag: "Brute" }         captain has the tag (also trait / flaw / item)
  //   { trait: "..." } { flaw: "..." } { item: "..." }
  //   { notTag: "..." }
  //   { season: "Spring" }     or a list: { season: ["Spring", "Summer"] }
  //   { gold: { pot: "crew", atLeast: 20 } }
  //   { gender: "f" }          the captain's
  //   { all: [...] } { any: [...] } { not: {...} }
  function test(state, cond) {
    if (!cond) return true;
    if (Array.isArray(cond)) return cond.every(function (c) { return test(state, c); });
    var c = state.captain;
    if (cond.all) return cond.all.every(function (x) { return test(state, x); });
    if (cond.any) return cond.any.some(function (x) { return test(state, x); });
    if (cond.not) return !test(state, cond.not);
    if (cond.flag) return state.flags[cond.flag] === true;
    if (cond.notFlag) return state.flags[cond.notFlag] !== true;
    if (cond.tag) return (c.tags || []).indexOf(cond.tag) >= 0;
    if (cond.notTag) return (c.tags || []).indexOf(cond.notTag) < 0;
    if (cond.trait) return (c.traits || []).indexOf(cond.trait) >= 0;
    if (cond.flaw) return (c.flaws || []).indexOf(cond.flaw) >= 0;
    if (cond.item) return (c.items || []).indexOf(cond.item) >= 0;
    if (cond.gender) return c.gender === cond.gender;
    if (cond.season) {
      var s = PC.state.seasonName(state);
      return Array.isArray(cond.season) ? cond.season.indexOf(s) >= 0 : cond.season === s;
    }
    if (cond.gold) return (state.money[cond.gold.pot] || 0) >= cond.gold.atLeast;
    throw new Error("Unknown condition: " + JSON.stringify(cond));
  }

  // ---- Entering and leaving scenes ------------------------------------

  function canEnter(state, id) {
    var s = sceneById(id);
    if (s.repeat !== "season" && state.seen[id]) return { ok: false, why: "Already done" };
    if (s.repeat === "season" && state.seen[id] === seasonStamp(state)) return { ok: false, why: "Done this season" };
    if (!test(state, s.firesWhen)) return { ok: false, why: "Not available" };
    if ((s.ap || 0) > state.ap.left) return { ok: false, why: "Not enough time this season" };
    return { ok: true };
  }

  function seasonStamp(state) { return state.time.year + "-" + state.time.season; }

  function enterScene(state, id) {
    var s = sceneById(id);
    if (s.ap) state.ap.left -= s.ap;
    state.current = { screen: "scene", sceneId: id, phase: "choosing", pending: null };
  }

  function goTo(state, exit) {
    if (!exit || exit === "hub") {
      state.current = { screen: "hub", hubId: PC.data.start.hub };
      return;
    }
    enterScene(state, exit);
  }

  // ---- What the player sees -------------------------------------------

  function setupText(state, s) {
    var text = s.setup || "";
    (s.variants || []).forEach(function (v) {
      if (!test(state, v.when)) return;
      if (v.replace) text = text.split(v.replace).join(v.line);
      else text = text + "\n\n" + v.line;
    });
    return PC.text.render(text, state);
  }

  function costProblem(state, cost) {
    if (!cost) return null;
    if (cost.gold && (state.money[cost.pot || "crew"] || 0) < cost.gold) {
      return "Needs " + cost.gold + " gold (" + (cost.pot === "purse" ? "your purse" : "crew gold") + ")";
    }
    return null;
  }

  function choiceView(state, s, ch, index) {
    var v = { index: index, label: PC.text.render(ch.label, state), status: "open", reason: null, check: null, cost: ch.cost || null };
    if (ch.hiddenUnless && !test(state, ch.hiddenUnless)) v.status = "hidden";
    else if (ch.lockedUnless && !test(state, ch.lockedUnless)) { v.status = "locked"; v.reason = ch.lockedReason || "Locked"; }
    else {
      var cp = costProblem(state, ch.cost);
      if (cp) { v.status = "locked"; v.reason = cp; }
    }
    if (ch.check && v.status !== "hidden") {
      v.check = PC.checks.assess(state, ch.check, { conditions: s.conditions || [] });
      if (v.status === "open" && v.check.locked) { v.status = "locked"; v.reason = "Needs a tag or a clock"; }
    }
    return v;
  }

  function viewScene(state) {
    var s = sceneById(state.current.sceneId);
    var view = {
      id: s.id, kind: s.kind, title: s.title || "", where: s.where || "",
      setup: setupText(state, s),
      choices: s.choices.map(function (ch, i) { return choiceView(state, s, ch, i); })
                        .filter(function (c) { return c.status !== "hidden"; }),
      phase: state.current.phase,
      result: null,
    };
    if (state.current.phase === "result") view.result = resultView(state, s);
    return view;
  }

  function outcomeFor(ch, outcome) {
    if (!ch.check) return ch.result;
    return ch.outcomes[outcome];
  }

  function resultView(state, s) {
    var p = state.current.pending;
    var ch = s.choices[p.choiceIndex];
    var o = outcomeFor(ch, p.outcome);
    var reroll = ch.check ? PC.checks.availableReroll(state, ch.check, p.outcome) : null;
    if (p.rerolled) reroll = null; // at most one reroll per roll
    return {
      choiceLabel: PC.text.render(ch.label, state),
      outcome: p.outcome, // "clean" | "partial" | "setback" | "result"
      roll: p.roll || null,
      firstRoll: p.firstRoll || null,
      text: PC.text.render(o.text, state),
      effects: (o.effects || []).map(function (e) { return describeEffect(state, e); }),
      needsPot: (o.effects || []).some(function (e) { return e.gold > 0 && (!e.pot || e.pot === "prompt"); }),
      reroll: reroll,
    };
  }

  // ---- Making a choice -------------------------------------------------

  function rollKey(state, sceneId, choiceId) {
    var point = sceneId + "|" + choiceId;
    var n = state.rolls[point] || 0;
    state.rolls[point] = n + 1;
    return [state.world.seed, state.time.year, state.time.season, point, n].join("|");
  }

  function choose(state, index) {
    if (state.current.phase !== "choosing") throw new Error("Not choosing right now.");
    var s = sceneById(state.current.sceneId);
    var ch = s.choices[index];
    if (!ch) throw new Error("No such choice.");
    var v = choiceView(state, s, ch, index);
    if (v.status !== "open") throw new Error("That choice is " + v.status + ".");

    if (ch.cost && ch.cost.gold) state.money[ch.cost.pot || "crew"] -= ch.cost.gold;

    var pending = { choiceIndex: index, outcome: "result" };
    if (ch.check) {
      var key = rollKey(state, s.id, ch.id || index);
      var r = PC.checks.resolve(state, ch.check, key, { conditions: s.conditions || [] });
      pending.outcome = r.outcome;
      pending.roll = { dice: r.dice, total: r.total, edge: r.assessment.edge, tier: r.assessment.tier, type: ch.check.type };
      pending.key = key;
    }
    state.current.phase = "result";
    state.current.pending = pending;
  }

  function reroll(state) {
    var s = sceneById(state.current.sceneId);
    var p = state.current.pending;
    var ch = s.choices[p.choiceIndex];
    var r = PC.checks.availableReroll(state, ch.check, p.outcome);
    if (!r || p.rerolled) throw new Error("No reroll available.");
    state.rerollsUsed[r.id] = (state.rerollsUsed[r.id] || 0) + 1;
    var res = PC.checks.resolve(state, ch.check, p.key + "|reroll", { conditions: s.conditions || [] });
    p.firstRoll = { roll: p.roll, outcome: p.outcome, by: r.name };
    p.outcome = res.outcome; // the new result stands
    p.roll = { dice: res.dice, total: res.total, edge: res.assessment.edge, tier: res.assessment.tier, type: ch.check.type };
    p.rerolled = true;
  }

  // Apply the outcome's effects and follow its exit. `pot` answers the
  // purse-or-crew prompt for any gold gained ("purse" or "crew").
  function commit(state, pot) {
    var s = sceneById(state.current.sceneId);
    var p = state.current.pending;
    var ch = s.choices[p.choiceIndex];
    var o = outcomeFor(ch, p.outcome);
    PC.state.addLog(state, PC.text.render(ch.label, state) + " — " + labelFor(p.outcome));
    (o.effects || []).forEach(function (e) {
      var line = applyEffect(state, e, pot);
      if (line) PC.state.addLog(state, "  " + line);
    });
    state.seen[s.id] = s.repeat === "season" ? seasonStamp(state) : true;
    goTo(state, o.exit);
  }

  function labelFor(outcome) {
    return { clean: "clean success", partial: "partial success", setback: "setback", result: "done" }[outcome];
  }

  // ---- Effects (§33.1.4) ----------------------------------------------

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function signed(n) { return (n > 0 ? "+" : "") + n; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  var FACTIONS = { frisia: "Frisia", avalon: "Avalon", pirates: "the pirates" };

  function describeEffect(state, e) {
    if ("gold" in e) {
      var where = e.pot === "purse" ? " (your purse)" : e.pot === "crew" ? " (crew gold)" : "";
      return (e.gold > 0 ? "+" : "") + e.gold + " gold" + where;
    }
    if ("provisions" in e) return "Provisions " + signed(e.provisions);
    if ("hull" in e) return "Hull " + signed(e.hull);
    if ("morale" in e) return "Crew morale " + signed(e.morale);
    if ("pressure" in e) return "Crew pressure " + signed(e.pressure);
    if ("dread" in e) return "Dread " + signed(e.dread);
    if ("standing" in e) return "Standing with " + FACTIONS[e.standing.faction] + " " + signed(e.standing.delta);
    if ("heat" in e) return "Heat with " + FACTIONS[e.heat.faction] + " " + signed(e.heat.delta);
    if ("ladder" in e) {
      var n = PC.data.npcs[e.ladder.npc];
      return (n ? n.first : e.ladder.npc) + (e.ladder.delta > 0 ? " warms to you" : " cools on you");
    }
    if ("tag" in e) return e.tell === false ? null : (e.remove ? "Lost tag: " : "New tag: ") + e.tag;
    if ("item" in e) return "Gained: " + e.item;
    if ("ap" in e) return "Time " + signed(e.ap);
    if ("flag" in e) return null; // flags are silent
    return null;
  }

  function applyEffect(state, e, pot) {
    if ("gold" in e) {
      var p = e.pot && e.pot !== "prompt" ? e.pot : (pot || "crew");
      state.money[p] = (state.money[p] || 0) + e.gold;
      return (e.gold > 0 ? "+" : "") + e.gold + " gold to " + (p === "purse" ? "your purse" : "crew gold");
    }
    if ("provisions" in e) { state.provisions = Math.max(0, state.provisions + e.provisions); }
    else if ("hull" in e) { state.ship.hull = clamp(state.ship.hull + e.hull, 0, state.ship.hullMax); }
    else if ("morale" in e) { state.crew.morale = clamp(state.crew.morale + e.morale, 0, 100); }
    else if ("pressure" in e) { state.crew.pressure = Math.max(0, state.crew.pressure + e.pressure); }
    else if ("dread" in e) { state.meters.dread = clamp(state.meters.dread + e.dread, 0, 100); }
    else if ("standing" in e) {
      var f = e.standing.faction;
      state.meters.standing[f] = clamp(state.meters.standing[f] + e.standing.delta, -100, 100);
    }
    else if ("heat" in e) {
      var h = e.heat.faction;
      state.meters.heat[h] = clamp((state.meters.heat[h] || 0) + e.heat.delta, 0, 100);
    }
    else if ("ladder" in e) {
      var npc = (state.npcs[e.ladder.npc] = state.npcs[e.ladder.npc] || { rung: 0 });
      npc.rung += e.ladder.delta;
    }
    else if ("tag" in e) {
      var tags = state.captain.tags;
      var i = tags.indexOf(e.tag);
      if (e.remove) { if (i >= 0) tags.splice(i, 1); }
      else if (i < 0) tags.push(e.tag);
    }
    else if ("item" in e) { state.captain.items.push(e.item); }
    else if ("ap" in e) { state.ap.left = Math.max(0, state.ap.left + e.ap); }
    else if ("flag" in e) { state.flags[e.flag] = e.value !== false; return null; }
    else return "[engine note: this effect isn't built yet: " + JSON.stringify(e) + "]";
    return describeEffect(state, e);
  }

  // ---- The hub (a placeholder location menu) --------------------------

  function viewHub(state) {
    var hub = PC.data.hubs[state.current.hubId];
    return {
      title: hub.title,
      text: PC.text.render(hub.text, state),
      entries: hub.entries.map(function (en) {
        var ce = canEnter(state, en.scene);
        var s = sceneById(en.scene);
        return { label: en.label, scene: en.scene, ap: s.ap || 0, ok: ce.ok, why: ce.why || null };
      }).filter(function (en) { return en.ok || en.why !== "Not available"; }),
    };
  }

  function endSeason(state) {
    PC.state.advanceSeason(state);
    state.current = { screen: "hub", hubId: PC.data.start.hub };
  }

  PC.scenes = {
    test: test,
    sceneById: sceneById,
    canEnter: canEnter,
    enterScene: enterScene,
    viewScene: viewScene,
    viewHub: viewHub,
    choose: choose,
    reroll: reroll,
    commit: commit,
    endSeason: endSeason,
    applyEffect: applyEffect,
  };
})();
</script>
  <script>
/* Pirate Chronicle — content checker.
 *
 * Reads every scene and hub and reports mistakes before a player finds them:
 * unknown check types, DRs out of range, missing outcomes, exits that go
 * nowhere, unknown effects, tokens that don't resolve. Run by the tests, and
 * from the game's Developer panel.
 */
(function () {
  "use strict";
  var PC = (globalThis.PC = globalThis.PC || {});

  var KINDS = ["check", "choice", "beat"];
  var EFFECT_KEYS = ["gold", "provisions", "hull", "morale", "pressure", "dread", "standing", "heat",
    "ladder", "tag", "item", "ap", "flag"];
  var FACTIONS = ["frisia", "avalon", "pirates"];

  function validate(sampleState) {
    var errors = [], warnings = [];
    var d = PC.data;
    function err(where, msg) { errors.push(where + ": " + msg); }
    function warn(where, msg) { warnings.push(where + ": " + msg); }

    function checkExit(where, exit) {
      if (!exit) return err(where, "missing exit");
      if (exit !== "hub" && !d.scenes[exit]) err(where, "exit goes to unknown scene '" + exit + "'");
    }

    function checkText(where, text) {
      if (!text) return;
      var out = PC.text.render(text, sampleState);
      PC.text.unresolved(out).forEach(function (t) { err(where, "unresolved token " + t); });
    }

    function checkEffects(where, effects) {
      (effects || []).forEach(function (e) {
        var keys = Object.keys(e).filter(function (k) { return EFFECT_KEYS.indexOf(k) >= 0; });
        if (keys.length !== 1) return err(where, "effect needs exactly one known kind: " + JSON.stringify(e));
        if (e.gold < 0 && e.pot !== "crew" && e.pot !== "purse") err(where, "gold spent needs pot 'crew' or 'purse'");
        if (e.standing && FACTIONS.indexOf(e.standing.faction) < 0) err(where, "unknown faction " + e.standing.faction);
        if (e.heat && ["frisia", "avalon"].indexOf(e.heat.faction) < 0) err(where, "Heat is Frisia or Avalon only");
        if (e.ladder && !d.npcs[e.ladder.npc]) err(where, "unknown NPC " + e.ladder.npc);
      });
    }

    function checkCond(where, cond) {
      if (!cond) return;
      try { PC.scenes.test(sampleState, cond); } catch (ex) { err(where, ex.message); }
    }

    Object.keys(d.scenes).forEach(function (id) {
      var s = d.scenes[id];
      var w = "scene " + id;
      if (s.id !== id) err(w, "id field doesn't match its key");
      if (/[^a-z0-9_]/.test(id)) err(w, "IDs are plain lowercase ASCII with underscores (§33.1.3)");
      if (KINDS.indexOf(s.kind) < 0) err(w, "kind must be check, choice or beat");
      if (s.repeat && ["once", "season"].indexOf(s.repeat) < 0) err(w, "repeat must be once or season");
      checkCond(w, s.firesWhen);
      checkText(w + " setup", s.setup);
      (s.variants || []).forEach(function (v, i) { checkCond(w + " variant " + i, v.when); checkText(w + " variant " + i, v.line); });
      if (!s.choices || !s.choices.length) return err(w, "no choices");
      if (s.kind === "beat" && s.choices.length !== 1) err(w, "a beat has exactly one choice");
      if (s.kind !== "beat" && s.choices.length > 4) warn(w, s.choices.length + " choices (the template says 2-4)");
      if (s.kind === "check" && !s.choices.some(function (c) { return c.check; })) warn(w, "a check scene with no checks");
      s.choices.forEach(function (ch, i) {
        var cw = w + " choice " + (ch.id || i);
        checkText(cw + " label", ch.label);
        checkCond(cw + " lockedUnless", ch.lockedUnless);
        checkCond(cw + " hiddenUnless", ch.hiddenUnless);
        if (s.kind !== "beat" && !(ch.approval && ch.approval.length)) warn(cw, "no approval tags (§33.1.3)");
        if (ch.check) {
          if (s.kind !== "check") err(cw, "only check scenes roll");
          if (!d.checkTypes[ch.check.type]) err(cw, "unknown check type '" + ch.check.type + "'");
          ["stat", "stat2"].forEach(function (k) {
            if (ch.check[k] && PC.checks.STATS.indexOf(ch.check[k]) < 0) err(cw, "unknown stat " + ch.check[k]);
          });
          var dr = ch.check.dr;
          if (typeof dr !== "number" || dr < 0 || dr > 8) err(cw, "DR must be 0-8");
          else if (dr > 5) warn(cw, "DR " + dr + " is above the Year 1 range (0-5)");
          ["clean", "partial", "setback"].forEach(function (o) {
            var oc = ch.outcomes && ch.outcomes[o];
            if (!oc) return err(cw, "missing " + o + " outcome");
            checkText(cw + " " + o, oc.text);
            checkEffects(cw + " " + o, oc.effects);
            checkExit(cw + " " + o, oc.exit);
          });
        } else {
          if (!ch.result) return err(cw, "a choice without a check needs a result");
          checkText(cw + " result", ch.result.text);
          checkEffects(cw + " result", ch.result.effects);
          checkExit(cw + " result", ch.result.exit);
        }
      });
    });

    Object.keys(d.hubs).forEach(function (id) {
      d.hubs[id].entries.forEach(function (en) {
        if (!d.scenes[en.scene]) err("hub " + id, "entry goes to unknown scene '" + en.scene + "'");
      });
    });
    if (!d.scenes[d.start.scene]) err("start", "unknown start scene");
    if (!d.hubs[d.start.hub]) err("start", "unknown start hub");

    return { errors: errors, warnings: warnings };
  }

  PC.validate = validate;
})();
</script>

 * Each entry:
 *   name:   shown in the check breakdown
 *   edge:   [{ type: "Persuade", value: -1 }]  or  [{ stat: "Charm", value: 1 }]

    "Ash-Born": { name: "Ash-Born" }, // no check effect; unlocks scenes
    "Grief-Stricken": { name: "Grief-Stricken", edge: [{ type: "Rally Crew", value: -1 }, { type: "Tavern Talk", value: -1 }] },

/* The Milestone 0 test captain.
 *
 * The character creator (a later milestone) builds this object from the
 * player's choices. Until then every new game starts with Dewey Test.
 * Starting package from §12.5 and §12.12.
 */

  <script>
/* Pirate Chronicle — drawing the screen.
 *
 * Plain placeholder styling: the UI chat designs the real look. Everything
 * here reads from the engine (PC.scenes, PC.checks) and calls back into it;
 * no game rules live in this file.
 */
(function () {
  "use strict";
  var PC = (globalThis.PC = globalThis.PC || {});

  var state = null;
  var root = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Paragraphs on blank lines; *stage business* in italics (§33.3.3).
  function prose(text) {
    return String(text || "").split(/\n\n+/).filter(Boolean).map(function (p) {
      return "<p>" + esc(p).replace(/\*([^*]+)\*/g, "<em>*$1*</em>").replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  function pct(x) { return Math.round(x * 100) + "%"; }
  function signed(n) { return (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n); }

  // ---- Save after every action ----------------------------------------

  function act(fn) {
    return function () {
      try { fn.apply(null, arguments); }
      catch (e) { console.error(e); toast("Something went wrong: " + e.message); }
      if (state) PC.state.saveToBrowser(state);
      draw();
    };
  }

  // ---- Screens ---------------------------------------------------------

  function draw() {
    if (!state) return drawTitle();
    root.innerHTML =
      '<div class="game">' + topBar() +
      '<div class="body"><aside class="sheet">' + captainSheet() + "</aside>" +
      '<main class="stage">' + (state.current.screen === "hub" ? hubPanel() : scenePanel()) + logPanel() + "</main></div></div>";
    wire();
  }

  function drawTitle() {
    var hasSave = !!PC.state.loadFromBrowser();
    root.innerHTML =
      '<div class="title-screen">' +
      "<h1>Pirate Chronicle</h1>" +
      '<p class="sub">Prototype · Milestone 0 · engine test</p>' +
      '<div class="title-buttons">' +
      (hasSave ? '<button data-act="continue" class="primary">Continue</button>' : "") +
      '<button data-act="new"' + (hasSave ? "" : ' class="primary"') + ">New game</button>" +
      '<button data-act="import">Load a save file</button>' +
      "</div>" +
      '<p class="note">This build tests the engine with placeholder scenes. Ocracoke comes next.</p>' +
      "</div>";
    wire();
  }

  function topBar() {
    return '<header class="topbar">' +
      '<span class="brand">Pirate Chronicle</span>' +
      '<span class="when">' + esc(PC.state.seasonName(state)) + " " + state.time.year + "</span>" +
      '<span class="ap" title="Actions left this season">' + apPips() + "</span>" +
      '<span class="spacer"></span>' +
      '<button data-act="export" title="Download your save as a file">Save file</button>' +
      '<button data-act="import" title="Load a save file">Load file</button>' +
      '<button data-act="dev">Developer</button>' +
      '<button data-act="quit">Title</button>' +
      "</header>";
  }

  function apPips() {
    var out = "";
    for (var i = 0; i < state.ap.max; i++) out += '<i class="' + (i < state.ap.left ? "on" : "off") + '"></i>';
    return out + ' <small>' + state.ap.left + "/" + state.ap.max + "</small>";
  }

  function row(label, value) { return "<tr><th>" + esc(label) + "</th><td>" + value + "</td></tr>"; }

  function captainSheet() {
    var c = state.captain;
    var stats = PC.checks.STATS.map(function (s) {
      return '<span class="stat"><b>' + c.stats[s] + "</b>" + esc(s) + "</span>";
    }).join("");
    var training = Object.keys(c.training || {}).map(function (t) {
      return esc(t) + " +" + c.training[t];
    }).join(", ") || "None";
    var m = state.meters;
    return '<h2>' + esc(c.first + " " + c.last) + "</h2>" +
      '<p class="muted">Age ' + c.age + " · Ash-Born of " + esc(c.homeCity) + "</p>" +
      '<div class="stats">' + stats + "</div>" +
      '<p class="small"><b>Training:</b> ' + training + "</p>" +
      '<p class="small"><b>Tags:</b> ' + esc((c.tags || []).join(", ") || "None") + "</p>" +
      '<p class="small"><b>Items:</b> ' + esc((c.items || []).join(", ") || "None") + "</p>" +
      '<table class="ledger">' +
      row("Crew gold", state.money.crew) +
      row("Your purse", state.money.purse) +
      row("Provisions", state.provisions + " lots") +
      row(state.ship.type, "<i>" + esc(state.ship.name) + "</i>") +
      row("Hull", state.ship.hull + " / " + state.ship.hullMax) +
      row("Guns", state.ship.guns + " / " + state.ship.gunsMax) +
      row("Crew", state.crew.count + " hands") +
      row("Morale", state.crew.morale) +
      row("Dread", m.dread) +
      row("Standing", "Frisia " + m.standing.frisia + " · Avalon " + m.standing.avalon + " · Pirates " + m.standing.pirates) +
      row("Heat", "Frisia " + m.heat.frisia + " · Avalon " + m.heat.avalon) +
      "</table>";
  }

  function checkLine(chk) {
    if (!chk) return "";
    var parts = chk.parts.map(function (p) {
      return "<li><span>" + esc(p.label) + "</span><b>" + signed(p.value) + "</b></li>";
    }).join("");
    var capNote = chk.modsCapped ? '<li class="muted">Traits and tags are capped at ±3.</li>' : "";
    var clampNote = chk.rawEdge !== chk.edge ? '<li class="muted">Edge is clamped to −4…+6.</li>' : "";
    return '<details class="check"><summary>' +
      "<span class=\"ctype\">" + esc(chk.type) + "</span> · <span class=\"tier tier-" + chk.tier.replace(/\s/g, "") + "\">" + esc(chk.tier) + "</span>" +
      ' <span class="odds">' + pct(chk.odds.partialOrBetter) + " success · " + pct(chk.odds.clean) + " clean</span>" +
      "</summary><ul>" + parts + '<li class="total"><span>Edge</span><b>' + signed(chk.edge) + "</b></li>" + capNote + clampNote + "</ul></details>";
  }

  function costLine(cost) {
    if (!cost || !cost.gold) return "";
    return '<span class="cost">Costs ' + cost.gold + " gold from " + (cost.pot === "purse" ? "your purse" : "crew gold") + "</span>";
  }

  function scenePanel() {
    var v = PC.scenes.viewScene(state);
    var html = '<section class="scene">' +
      '<div class="where">' + esc(v.where) + "</div>" +
      (v.title ? "<h2>" + esc(v.title) + "</h2>" : "") +
      '<div class="setup">' + prose(v.setup) + "</div>";
    if (v.phase === "choosing") {
      html += '<ol class="choices">' + v.choices.map(function (c) {
        var locked = c.status === "locked";
        return '<li class="' + (locked ? "locked" : "") + '">' +
          '<button data-act="choose" data-i="' + c.index + '"' + (locked ? " disabled" : "") + ">" + esc(c.label) + "</button>" +
          (locked ? '<span class="lock">🔒 ' + esc(c.reason) + "</span>" : "") +
          costLine(c.cost) + (locked ? "" : checkLine(c.check)) +
          "</li>";
      }).join("") + "</ol>";
    } else {
      html += resultPanel(v.result);
    }
    return html + "</section>";
  }

  var OUTCOME_LABEL = { clean: "Clean success", partial: "Partial success", setback: "Setback", result: "" };

  function diceLine(roll) {
    if (!roll || !state.settings.showDice) return "";
    return '<div class="dice">Dice ' + roll.dice[0] + " + " + roll.dice[1] + ", edge " + signed(roll.edge) + " = " + roll.total + "</div>";
  }

  function resultPanel(r) {
    var html = '<div class="result">' +
      '<p class="you-chose">' + esc(r.choiceLabel) + "</p>";
    if (r.firstRoll) {
      html += '<p class="muted small">First roll: ' + OUTCOME_LABEL[r.firstRoll.outcome] + ". Rerolled with " + esc(r.firstRoll.by) + ".</p>";
    }
    if (OUTCOME_LABEL[r.outcome]) html += '<div class="badge badge-' + r.outcome + '">' + OUTCOME_LABEL[r.outcome] + "</div>";
    html += diceLine(r.roll) + prose(r.text);
    var eff = r.effects.filter(Boolean);
    if (eff.length) html += '<ul class="effects">' + eff.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + "</ul>";
    html += '<div class="actions">';
    if (r.reroll) html += '<button data-act="reroll">Reroll (' + esc(r.reroll.name) + ")</button>";
    if (r.needsPot) {
      html += '<button data-act="commit" data-pot="purse" class="primary">Into your purse</button>' +
              '<button data-act="commit" data-pot="crew" class="primary">Share it with the crew</button>';
    } else {
      html += '<button data-act="commit" class="primary">Continue</button>';
    }
    return html + "</div></div>";
  }

  function hubPanel() {
    var h = PC.scenes.viewHub(state);
    return '<section class="scene hub">' +
      "<h2>" + esc(h.title) + "</h2>" + prose(h.text) +
      '<ol class="choices">' + h.entries.map(function (en) {
        return "<li" + (en.ok ? "" : ' class="locked"') + '><button data-act="enter" data-scene="' + esc(en.scene) + '"' + (en.ok ? "" : " disabled") + ">" +
          esc(en.label) + (en.ap ? " <small>(" + en.ap + " action" + (en.ap > 1 ? "s" : "") + ")</small>" : "") + "</button>" +
          (en.ok ? "" : '<span class="lock">' + esc(en.why) + "</span>") + "</li>";
      }).join("") + "</ol>" +
      '<div class="actions"><button data-act="endseason">End the season</button></div>' +
      "</section>";
  }

  function logPanel() {
    var lines = state.log.slice(-30).reverse();
    return '<details class="log"><summary>Ship\'s log</summary>' +
      (lines.length ? "<ul>" + lines.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul>" : '<p class="muted">Nothing yet.</p>') +
      "</details>";
  }

  // ---- Developer panel -------------------------------------------------

  function devPanel() {
    var v = PC.validate(state);
    var list = function (arr) { return arr.length ? "<ul>" + arr.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "<p>None.</p>"; };
    return '<div class="modal" data-act="closedev"><div class="panel" onclick="event.stopPropagation()">' +
      "<h2>Developer</h2>" +
      '<label><input type="checkbox" data-act="toggledice"' + (state.settings.showDice ? " checked" : "") + "> Show the dice on results</label>" +
      '<label><input type="checkbox" data-act="togglegender"' + (state.captain.gender === "f" ? " checked" : "") + "> Woman captain (tests the pronoun swap)</label>" +
      '<div class="actions"><button data-act="addap">+1 action</button><button data-act="tohub">Go to the harbor menu</button></div>' +
      '<p class="small muted">World seed: ' + esc(state.world.seed) + " · save version " + state.saveVersion + "</p>" +
      "<h3>Content check</h3><p><b>Errors</b></p>" + list(v.errors) + "<p><b>Warnings</b></p>" + list(v.warnings) +
      '<div class="actions"><button data-act="closedev" class="primary">Close</button></div>' +
      "</div></div>";
  }

  // ---- Files -----------------------------------------------------------

  function exportSave() {
    var blob = new Blob([PC.state.serialize(state)], { type: "application/json" });
    var a = document.createElement("a");
    var c = state.captain;
    a.href = URL.createObjectURL(blob);
    a.download = "pirate-chronicle-" + (c.first + "-" + c.last).toLowerCase().replace(/[^a-z0-9]+/g, "-") +
      "-" + PC.state.seasonName(state).toLowerCase() + "-" + state.time.year + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    toast("Save file downloaded.");
  }

  function importSave() {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".json,application/json";
    input.onchange = function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          state = PC.state.deserialize(String(reader.result));
          PC.state.saveToBrowser(state);
          toast("Save loaded.");
        } catch (e) { toast("Couldn't load that file: " + e.message); }
        draw();
      };
      reader.readAsText(f);
    };
    input.click();
  }

  function toast(msg) {
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3500);
  }

  // ---- Wiring ----------------------------------------------------------

  var handlers = {
    "continue": function () { state = PC.state.loadFromBrowser(); },
    "new": function () {
      if (PC.state.loadFromBrowser() && !confirm("Start a new game? Your current browser save will be replaced. (Download a save file first if you want to keep it.)")) return;
      state = PC.state.newGame(PC.data.testCaptain);
      PC.state.addLog(state, "— Spring 1754 begins. —");
    },
    "quit": function () { state = null; },
    "export": exportSave,
    "import": importSave,
    "choose": function (el) {
      PC.scenes.choose(state, Number(el.dataset.i));
      // A beat's "carry on" with nothing to show goes straight through.
      var r = PC.scenes.viewScene(state).result;
      if (r && r.outcome === "result" && !r.text && !r.effects.filter(Boolean).length) PC.scenes.commit(state);
    },
    "reroll": function () { PC.scenes.reroll(state); },
    "commit": function (el) { PC.scenes.commit(state, el.dataset.pot || null); },
    "enter": function (el) {
      var id = el.dataset.scene;
      if (PC.scenes.canEnter(state, id).ok) PC.scenes.enterScene(state, id);
    },
    "endseason": function () { PC.scenes.endSeason(state); },
    "dev": function () { showDev = true; },
    "closedev": function () { showDev = false; },
    "toggledice": function () { state.settings.showDice = !state.settings.showDice; },
    "togglegender": function () { state.captain.gender = state.captain.gender === "f" ? "m" : "f"; },
    "addap": function () { state.ap.left = Math.min(state.ap.max, state.ap.left + 1); },
    "tohub": function () { state.current = { screen: "hub", hubId: PC.data.start.hub }; showDev = false; },
  };

  var showDev = false;

  function wire() {
    if (showDev && state) root.insertAdjacentHTML("beforeend", devPanel());
    root.querySelectorAll("[data-act]").forEach(function (el) {
      var name = el.dataset.act;
      var h = handlers[name];
      if (!h) return;
      var evt = el.tagName === "INPUT" ? "change" : "click";
      el.addEventListener(evt, function (ev) {
        if (el.classList.contains("modal") && ev.target !== el) return;
        if (name === "export" || name === "import") { h(); return; }
        act(h)(el);
      });
    });
  }

  function start(rootEl) {
    root = rootEl;
    draw();
  }

  PC.ui = { start: start };
})();
</script>
  <script>PC.ui.start(document.getElementById("app"));</script>
</body>
